# Build Ghidra's native components (decompiler `decompile` + `sleigh`) for
# linux_arm_64 on a GitHub-hosted ARM64 runner, and publish them as a release
# asset. Official Ghidra releases only ship linux_x86_64/win_x86_64 natives, so
# this workflow is what makes the ARM64 port possible.
#
# Primary path : gradle buildNatives_linux_arm_64 (upstream build system)
# Fallback path: the upstream Makefile with ARCH_TYPE= (see scripts/build-natives.sh)
name: build-natives

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/build-natives.yml']

env:
  GHIDRA_REF: Ghidra_12.1.4_build
  NATIVES_TAG: natives-v12.1.4
  NATIVES_ASSET: ghidra-natives-linux-arm64-12.1.4.tar.gz

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout Ghidra source
        uses: actions/checkout@v4
        with:
          repository: NationalSecurityAgency/ghidra
          ref: ${{ env.GHIDRA_REF }}
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Fetch dependencies
        run: ./gradlew -I gradle/support/fetchDependencies.gradle help

      # buildNatives_linux_arm_64 builds every native component that declares
      # linux_arm_64. Some components (7-Zip-JBinding, Z3) may not support ARM64
      # and fail the task -- that is fine, we only require decompile + sleigh,
      # which is why this step is allowed to fail.
      - name: Gradle buildNatives_linux_arm_64
        continue-on-error: true
        run: ./gradlew buildNatives_linux_arm_64

      - name: Collect decompiler natives
        run: |
          set -euo pipefail
          mkdir -p out/Ghidra/Features/Decompiler/os/linux_arm_64
          for name in decompile sleigh; do
            src="$(find Ghidra -type f -path '*linux_arm_64*' -name "$name" | head -n1 || true)"
            if [ -n "$src" ]; then
              cp "$src" out/Ghidra/Features/Decompiler/os/linux_arm_64/
              echo "collected $src"
            fi
          done

      - name: Check what we got
        id: chk
        run: |
          ok=0
          [ -f out/Ghidra/Features/Decompiler/os/linux_arm_64/decompile ] && \
          [ -f out/Ghidra/Features/Decompiler/os/linux_arm_64/sleigh ] && ok=1
          echo "ok=$ok" >> "$GITHUB_OUTPUT"

      # Makefile fallback: the decompiler cpp tree ships with generated parser
      # sources, so a plain make works without flex/bison. ARCH_TYPE= strips the
      # bogus -m32 the Makefile assigns for non-x86_64 Linux; EXTRA= drops the
      # binutils/BFD-dependent files (need bfd.h from binutils-dev, unused at runtime).
      - name: Makefile fallback build
        if: steps.chk.outputs.ok == '0'
        run: |
          set -euo pipefail
          cd Ghidra/Features/Decompiler/src/decompile/cpp
          make -j"$(nproc)" ghidra_opt sleigh_opt ARCH_TYPE= EXTRA=
          mkdir -p "$GITHUB_WORKSPACE/out/Ghidra/Features/Decompiler/os/linux_arm_64"
          cp ghidra_opt sleigh_opt "$GITHUB_WORKSPACE/out/Ghidra/Features/Decompiler/os/linux_arm_64/"

      - name: Verify binaries are aarch64
        run: |
          set -euo pipefail
          d=out/Ghidra/Features/Decompiler/os/linux_arm_64
          test -f "$d/decompile" && test -f "$d/sleigh"
          file "$d/decompile" "$d/sleigh"
          file "$d/decompile" | grep -qi 'ARM aarch64'
          "$d/sleigh" 2>&1 | head -c 200 || true   # prints usage, proves it runs

      - name: Package
        run: |
          set -euo pipefail
          cd out
          tar -czf "$GITHUB_WORKSPACE/$NATIVES_ASSET" .
          cd "$GITHUB_WORKSPACE"
          sha256sum "$NATIVES_ASSET" | tee "$NATIVES_ASSET.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: ghidra-natives-linux-arm64
          path: |
            ${{ env.NATIVES_ASSET }}
            ${{ env.NATIVES_ASSET }}.sha256

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          args=(--repo "$GITHUB_REPOSITORY" --title "ARM64 natives for Ghidra 12.1.4" \
                --notes "linux_arm_64 builds of Ghidra's native decompiler (decompile + sleigh), cross-compiled on ubuntu-24.04-arm. Drop into Ghidra/Features/Decompiler/os/linux_arm_64/.")
          if gh release view "$NATIVES_TAG" >/dev/null 2>&1; then
            gh release upload "$NATIVES_TAG" "$NATIVES_ASSET" "$NATIVES_ASSET.sha256" --clobber "${args[@]}"
          else
            gh release create "$NATIVES_TAG" "$NATIVES_ASSET" "$NATIVES_ASSET.sha256" "${args[@]}"
          fi
