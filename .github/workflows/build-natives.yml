# Build Ghidra's native components (decompiler `decompile` + `sleigh`) for
# Android ARM64 (Termux) and publish them as a release asset.
#
# Official Ghidra releases only ship linux_x86_64/win_x86_64 natives, so ARM64
# users must supply their own.
#
# IMPORTANT: the build MUST happen inside an aarch64 Termux container so the
# binaries link against Android *bionic*. A plain glibc cross-build (e.g. the
# upstream `gradle buildNatives_linux_arm_64`) produces ELF binaries that need
# /lib/ld-linux-aarch64.so.1 and CANNOT run on Android ("cannot execute:
# required file not found"). This was learned the hard way -- don't "simplify"
# this back to a gradle/make cross-build on the Ubuntu runner.
#
# Primary path : docker termux/termux-docker:aarch64 + make (identical to
#                scripts/build-natives.sh on a real device)
name: build-natives

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/build-natives.yml']

permissions:
  contents: write

env:
  GHIDRA_REF: Ghidra_12.1.4_build
  NATIVES_TAG: natives-v12.1.4
  ANDROID_ASSET: ghidra-natives-android-aarch64-12.1.4.tar.gz

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout Ghidra source
        uses: actions/checkout@v4
        with:
          repository: NationalSecurityAgency/ghidra
          ref: ${{ env.GHIDRA_REF }}
          fetch-depth: 1

      # Same build as scripts/build-natives.sh, but inside an aarch64 Termux
      # container so the output links against bionic, like a real device.
      # The container's default user is not root and cannot write into the
      # bind-mounted workspace, so open it up first. Results are extracted
      # with `docker cp` (via the daemon) to avoid cross-uid permission
      # problems on the workspace.
      - name: Build natives in Termux container
        run: |
          set -euo pipefail
          mkdir -p out
          chmod -R a+rwX "$GITHUB_WORKSPACE"
          # The container's default entrypoint is `env`, and bash lives at the
          # full Termux prefix path inside the image (NOT /bin/bash).
          cid=$(docker create -v "$PWD:/w" -w /w termux/termux-docker:aarch64 \
            /data/data/com.termux/files/usr/bin/bash -c '
              set -e
              P=/data/data/com.termux/files/usr
              export PATH=$P/bin:$P/bin/applets:$PATH
              pkg install -y make clang
              cd /w/Ghidra/Features/Decompiler/src/decompile/cpp
              mkdir -p ghi_opt sla_opt
              make -j"$(nproc)" ghidra_opt sleigh_opt ARCH_TYPE= EXTRA= || true
              if [ ! -f ghidra_opt ] || [ ! -f sleigh_opt ]; then
                # libc++ header/lib skew: force-link the static libc++ from ndk-multilib
                make ghidra_opt sleigh_opt ARCH_TYPE= EXTRA= \
                  MAKE_STATIC="-Wl,--whole-archive $P/aarch64-linux-android/lib/libc++_static.a -Wl,--no-whole-archive"
              fi
              test -f ghidra_opt && test -f sleigh_opt
              echo "BUILD_OK: $(ls -la ghidra_opt sleigh_opt)"
            ')
          docker start -a "$cid"
          mkdir -p out/Ghidra/Features/Decompiler/os/linux_arm_64
          docker cp "$cid:/w/Ghidra/Features/Decompiler/src/decompile/cpp/ghidra_opt" \
            out/Ghidra/Features/Decompiler/os/linux_arm_64/decompile
          docker cp "$cid:/w/Ghidra/Features/Decompiler/src/decompile/cpp/sleigh_opt" \
            out/Ghidra/Features/Decompiler/os/linux_arm_64/sleigh
          docker rm "$cid"
          chmod -R a+rwX out
          ls -laR out

      - name: Verify binaries
        run: |
          set -euo pipefail
          d=out/Ghidra/Features/Decompiler/os/linux_arm_64
          test -f "$d/decompile" && test -f "$d/sleigh"
          file "$d/decompile" "$d/sleigh"
          file "$d/decompile" | grep -qi 'ARM aarch64'

      - name: Package
        run: |
          set -euo pipefail
          (cd out && tar -czf "$GITHUB_WORKSPACE/$ANDROID_ASSET" .)
          sha256sum "$ANDROID_ASSET" | tee "$ANDROID_ASSET.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: ghidra-natives-android-aarch64
          path: |
            ${{ env.ANDROID_ASSET }}
            ${{ env.ANDROID_ASSET }}.sha256

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          args=(--repo "$GITHUB_REPOSITORY" \
                --title "ARM64 natives for Ghidra 12.1.4 (Android/Termux, bionic)" \
                --notes "linux_arm_64 builds of Ghidra's native decompiler (decompile + sleigh) for Termux/Android, built in an aarch64 Termux container (bionic, NOT glibc). Drop into Ghidra/Features/Decompiler/os/linux_arm_64/.")
          if gh release view "$NATIVES_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$NATIVES_TAG" "$ANDROID_ASSET" "$ANDROID_ASSET.sha256" --clobber "${args[@]}"
          else
            gh release create "$NATIVES_TAG" "$ANDROID_ASSET" "$ANDROID_ASSET.sha256" "${args[@]}"
          fi
